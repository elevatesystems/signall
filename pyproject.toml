[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "signall"
dynamic = ["version"]
description = "Sign PDFs, including dynamic XFA forms, with a US DoD CAC on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyHanko[pkcs11]>=0.29",
    "pyhanko-certvalidator>=0.27",
    "lxml>=5.0",
    "requests>=2.31",  # OCSP, CRL, and CA certificate downloads
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pymupdf>=1.24"]

[project.scripts]
signall = "signall.cli:main"

[project.gui-scripts]
signall-app = "signall.app:main"

[tool.hatch.version]
path = "src/signall/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/signall"]
artifacts = ["src/signall/render/pdfjs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: needs WebKitGTK and a display (run under Xvfb)",
]
