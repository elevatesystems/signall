<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
<style>
  @page { size: 8.5in 11in; margin: 0 }
  html, body { margin: 0; padding: 0; background: #fff }
  .signall-page { position: relative; overflow: hidden; break-after: page; page-break-after: always }
  .signall-page:last-child { break-after: auto; page-break-after: auto }
  /* Match a printed Acrobat form: no field highlight, no dropdown chevrons. */
  .xfaLayer input, .xfaLayer textarea, .xfaLayer select {
    background: transparent !important; border: 0 !important; appearance: none; -webkit-appearance: none
  }
  .xfaLayer select { background-image: none !important }
  .xfaLayer input[type=checkbox], .xfaLayer input[type=radio] {
    appearance: auto !important; -webkit-appearance: checkbox !important; accent-color: #000
  }
  .xfaLayer *:focus { outline: none }
  .signall-caption { position: absolute; left: 2px; top: 1px; white-space: nowrap; color: #000 }
</style>
</head>
<body>
<div id="pages"></div>
<script type="module" src="page.js"></script>
</body>
</html>
