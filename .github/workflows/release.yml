name: Release

# Push a tag such as v0.1.0 (matching __version__ in src/signall/__init__.py) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/signall/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: python3 scripts/fetch-pdfjs.py
      - run: dev/run-tests.sh

  versions:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.fedora.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: fedora
        run: echo "list=$(python3 packaging/fedora-versions.py)" >> "$GITHUB_OUTPUT"

  # RPMs attached to the GitHub release, for every Fedora from 40 to the newest stable one.
  rpm:
    needs: [test, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        fedora: ${{ fromJSON(needs.versions.outputs.list) }}
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - run: dnf -y -q install git tar
      - uses: actions/checkout@v5
      - name: Build
        run: packaging/build-rpm.sh dist
      - name: Install and run it
        run: |
          dnf -y -q install dist/*.rpm
          signall --version
          signall inspect tests/fixtures/dd2875-blank.pdf
      - name: Name it for "latest" downloads
        run: |
          rpm=$(ls dist/*.rpm)
          cp "$rpm" "dist/signall-latest.fc${{ matrix.fedora }}.x86_64.rpm"
      - uses: actions/upload-artifact@v5
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: dist/*.rpm

  release:
    needs: rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *dev* || "$GITHUB_REF_NAME" == *rc* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/*.rpm --repo "$GITHUB_REPOSITORY" \
            --title "Signall ${GITHUB_REF_NAME#v}" --generate-notes $prerelease

  # The COPR repository (elevate-systems/Signall), which delivers updates through dnf and
  # GNOME Software. COPR builds for each Fedora it has enabled, and adds new Fedora releases
  # itself when they branch.
  copr:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: dnf -y -q install git tar rpm-build copr-cli
      - uses: actions/checkout@v5
      - name: Build the source RPM
        run: packaging/build-rpm.sh --srpm dist
      - name: Build in COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          copr-cli build elevate-systems/Signall dist/*.src.rpm
